name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --refresh

      - name: Run tests
        run: uv run pytest

      - name: Check lint
        run: uv run ruff check mlqmcpy tests

      - name: Check formatting
        run: uv run black --check mlqmcpy tests

      - name: Check import sorting
        run: uv run isort --check-only mlqmcpy tests
